<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/branding/ensemble-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Fraunces: multi-weight display serif for headlines (Google Fonts). -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <title>Ensemble Digital Labs — Digital & AI for Medical Practices</title>
    <!-- Minimal rules so cursor:none applies before Vite injects index.css (class alone is not enough). -->
    <style>
      @media (pointer: fine) and (prefers-reduced-motion: no-preference) {
        html.ensemble-custom-cursor {
          cursor: none !important;
        }
        html.ensemble-custom-cursor body {
          cursor: none !important;
        }
      }
    </style>
    <!-- Custom cursor: add class before React (same gates as MovingCircle). -->
    <script>
      (function () {
        try {
          if (
            window.matchMedia('(pointer: fine)').matches &&
            !window.matchMedia('(prefers-reduced-motion: reduce)').matches
          ) {
            document.documentElement.classList.add('ensemble-custom-cursor')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
